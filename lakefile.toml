name = "controllerPhase1"
version = "0.1.0"
defaultTargets = ["Controller", "Phase1"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "Controller"
globs = ["Controller.**"]
roots = ["Controller.Physical.ExactImage", "Controller.Physical.BridgeCofactors", "Controller.Physical.DetectionBridge", "Controller.Physical.GlobalProjection", "Controller.Physical.StuckAtImage"]

[[lean_lib]]
name = "Phase1"
globs = ["Phase1.**"]
roots = ["Phase1.P01.Challenge", "Phase1.P01.Solution"]
