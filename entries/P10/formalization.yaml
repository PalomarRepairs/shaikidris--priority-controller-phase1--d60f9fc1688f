status:
  scope: 'Six principal theorems from the 39-declaration K00 contract: accepted-image execution,
    polynomial-time TM2 compilation through an executed constructor, composed logarithmic-space
    tape execution, allocation-erased execution and visited-cell bounds, parameterized reduction
    composition and finite TM2 realization. Application-specific constructor existence and
    encoded-language class membership are separate obligations.'
