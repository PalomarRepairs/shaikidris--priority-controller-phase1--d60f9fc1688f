fidelity:
  divergences: The supplied forest, matching representation, nonnegative weights and native
    execution model are explicit. The selected weighted theorem assumes a returned candidate
    and proves score domination plus operation bounds. It does not by itself give a maximum-weight
    detecting witness or encoded-weight bit complexity.
review:
  status: self-assessed
  reviewers: []
  notes: Implementer audit of the frozen declaration list and proof-model boundaries. No independent
    human or Palomar review is claimed.
alignment:
  namespace: Controller
  statements:
  - source: '5.6'
    lean: Controller.Cost.ForestOriginalSemantics.original_physical_execution
    module: Controller.Cost.ForestOriginalSemantics
    status: proved
    note: For a supplied formula forest with matching rows, heads and roots, the actual drive-one
      native program halts, decides physical detectability and emits an admissible detecting
      realization on acceptance. The statement separately bounds native ticks/live words,
      weighted traversal operations, store trace and combined code/storage. Weights are nonnegative
      in the displayed ordered additive group; arithmetic bit cost is separate.
  - source: '6.7'
    lean: Controller.Optimization.Weights.forest_maximum_weight
    module: Controller.Optimization.Weights
    status: proved
    note: Conditional on the indexed weighted traversal returning a candidate, its score bounds
      the weight of every admissible set making any supplied root true. The theorem also proves
      linear indexed and arithmetic operation bounds. It supplies the upper-bound component
      of 6.7; it does not assert that the candidate score is attained, that a candidate exists
      whenever detection is possible, or that the physical output test has maximum weight.
acknowledgements: Lean 4, Mathlib, OpenAI Codex and Claude Code.
