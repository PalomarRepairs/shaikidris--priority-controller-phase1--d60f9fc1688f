alignment:
  namespace: Controller
  statements:
  - source: '7.2'
    lean: Controller.Decoder.DAG.exists_small_true_support
    module: Controller.Extensions.Support
    status: proved
    note: If a root is true on K and liveAndCount is at most k, a nonempty subset of K of
      size at most k+1 still makes it true. Sharing is counted by distinct live-AND nodes.
  - source: '7.2'
    lean: Controller.Decoder.DAG.exists_small_target_support
    module: Controller.Extensions.Support
    status: proved
    note: If K contains the target, a true subset containing it has size at most k+2 and is
      admissible for every bus count. This is the forced-target support component of 7.2.
  - source: '7.3'
    lean: Controller.Decoder.DAG.expansion_identity
    module: Controller.Extensions.Expansion
    status: proved
    note: On a child-closed node set, truth at any included node is equivalent to truth under
      every consistent selector expansion. A single selector choice is shared across all occurrences
      of a live-AND node.
  - source: '7.3'
    lean: Controller.Decoder.DAG.global_selector_count
    module: Controller.Extensions.Expansion
    status: proved
    note: The number of global selectors is exactly 2^liveAndCount. This is an exact finite
      counting statement.
  - source: '7.3'
    lean: Controller.Decoder.DAG.cone_expansion_identity
    module: Controller.Extensions.Expansion
    status: proved
    note: The cone-restricted expansion identity holds at every root and assignment, with
      one consistent selector on its cone.
  - source: '7.4'
    lean: Controller.Extensions.BoundedNativeComplete.execution
    module: Controller.Extensions.BoundedNativeComplete
    status: proved
    note: For raw native layout and a supplied bound k on liveAndCount, the actual detector
      halts with the exact displayed detection answer, native timeBound, working/code bounds
      and a checked native model plus eligible witness on acceptance. The native execution
      model and representation are explicit.
  - source: '7.4'
    lean: Controller.Extensions.BoundedNativeComplete.emitted_witness
    module: Controller.Extensions.BoundedNativeComplete
    status: proved
    note: Under raw layout and drive one, any decoded output accepted by the native model
      checker yields an admissible eligible set changing an observed root. This is checker-to-physical-witness
      soundness; actual accepting execution is supplied separately.
  - source: '7.4'
    lean: Controller.Extensions.BoundedNativeComplete.xp_time
    module: Controller.Extensions.BoundedNativeComplete
    status: proved
    note: The displayed native timeBound is at most 15000*((k+2)*(G+1)^(k+1)+(G+1)*2^k)*(G+1)+100*N.
      This establishes an XP upper bound with the formal size measures; it is not the exact
      sharper binomial expression stated in the manuscript.
  - source: '7.4'
    lean: Controller.Extensions.BoundedNativeComplete.one_and_time
    module: Controller.Extensions.BoundedNativeComplete
    status: proved
    note: For k=1, the native timeBound is at most 360000*(n^2+q)*G+100*N. Combined with the
      execution premise liveAndCount<=1, this gives the selected one-live-AND runtime bound.
  - source: '7.4'
    lean: Controller.Extensions.BoundedNativeComplete.healthy_one_time
    module: Controller.Extensions.BoundedNativeComplete
    status: proved
    note: When every supplied root is healthy one, native timeBound is at most 15000*(2^k+1)*(G+1)^2+100*N.
      This gives an FPT bound in k for that case; the selected inequality does not assert
      the sharper q*2^k*G expression.
  - source: 7.5 (proper-basis component)
    lean: Controller.Extensions.ProperBasisComplete.execution
    module: Controller.Extensions.ProperBasisComplete
    status: proved
    note: For a supplied proper gate basis and matching rows/heads/roots in raw layout, the
      selected native detector halts, decides drive-one feasibility, has the displayed polynomial
      tick/code/working bounds and emits a checked model on acceptance. This is the proper-basis
      algorithmic component of 7.5; the full-basis hardness half and conventional encoded-language
      membership are outside this selection.
