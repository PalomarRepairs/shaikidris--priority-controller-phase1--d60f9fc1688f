alignment:
  namespace: Controller
  statements:
  - source: '5.5'
    lean: Controller.Cost.Enumeration.execution
    module: Controller.Cost.Enumeration
    status: proved
    note: The actual native enumeration program halts and emits the specified representation
      of its complete result stream. The total bound includes up to 2^n prefix candidates
      plus a separate emitBudget per result; working peak is at most 258*(countedSize + 1).
      Immutable program storage and the retained external output stream are separate measures.
  - source: '5.5'
    lean: Controller.Cost.Enumeration.results_exact
    module: Controller.Cost.Enumeration
    status: proved
    note: The result sequence is duplicate-free and ordered by the explicit Before relation.
      Membership is exactly the Detecting predicate for the supplied guarded DAG, bus count,
      target and drive. Objects enumerated are eligible channel sets.
  - source: '5.5'
    lean: Controller.Cost.Enumeration.canonical_result_detects
    module: Controller.Cost.Enumeration
    status: proved
    note: Each enumerated eligible set gives a detecting drive-one canonical primary input
      under realizeBridge. This is a witness-correctness theorem and does not count every
      primary assignment or native-CNF model.
  - source: '5.5'
    lean: Controller.Cost.Enumeration.iterator_delay
    module: Controller.Cost.Enumeration
    status: proved
    note: From the displayed seek Runtime invariant, the actual program reaches the next emit
      or exhaustion endpoint within 100000*n*(n+q)*countedSize ticks and the stated working
      peak. Its external output is unchanged during this iterator transition; emission has
      its own charge.
  - source: '5.5'
    lean: Controller.Cost.Enumeration.delay_bound
    module: Controller.Cost.Enumeration
    status: proved
    note: The symbolic iterator delay function is bounded by 100000*n*(n+q)*countedSize. This
      arithmetic bound accompanies the separate actual iterator execution theorem.
  - source: '5.5'
    lean: Controller.Cost.Enumeration.program_words_bound
    module: Controller.Cost.Enumeration
    status: proved
    note: The immutable native program has the explicit linear word bound in channel count,
      coordinate count and countedSize, assuming RootsMatch. This bounds code words separately
      from mutable working storage and streamed output.
