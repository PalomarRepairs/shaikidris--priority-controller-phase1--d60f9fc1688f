    qualifier-observation detection equivalence, proper-coordinate projection obstruction
    and specified stuck-at classification. The selected entry asserts no running-time, counting,
    hardness, arbitrary-CNF recognition or whole-paper completion theorem. Other source-library
    families are outside this entry's comparison surface.
