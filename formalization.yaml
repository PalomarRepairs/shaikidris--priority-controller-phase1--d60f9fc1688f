fidelity:
  divergences: The first-bus existence proof is a field of the primary-input type, and legal
    bridge data imply at least two channels. Eligibility is expressed as nonemptiness together
    with target membership when the bus count is one. The projection theorem permits an arbitrary
    indexed family of local relations. Additional unnumbered remarks following Corollary 4.2
    and the manuscript's later results are not advertised by these selected declarations.
review:
  status: self-assessed
  reviewers: []
  notes: Implementer audit of literal controller equations, fault conventions, theorem types
    and permitted axioms. No independent human or Palomar review is claimed.
alignment:
  namespace: Controller.Physical
  statements:
  - source: Theorem 4.1, drive-one image
    lean: Controller.Physical.separated_drive_one_set_pair_image_iff
    module: Controller.Physical.ExactImage
    status: proved
    note: With positive bus count and the separated bridge interface, drive-one inputs whose
      first flags differ realize exactly the pairs H={target} and admissible K. Both directions
      quantify actual primary inputs and wire values; the faulty qualifier vector is read
      before observation encoding.
  - source: Theorem 4.1, drive zero
    lean: Controller.Physical.not_bridgeDetectable_drive_zero
    module: Controller.Physical.BridgeCofactors
    status: proved
    note: For drive zero, no input detects the separated bridge through any finite family
      of Boolean qualifier observations. The statement is independent of a decoder grammar.
  - source: Corollary 4.2
    lean: Controller.Physical.bridge_detectable_iff_exists_output
    module: Controller.Physical.DetectionBridge
    status: proved
    note: For positive bus count, physical bridge detectability is equivalent to drive one
      and an admissible set on which some Boolean observation differs from its target-singleton
      value. The observation family is arbitrary finite data.
  - source: Lemma 4.3, projection
    lean: Controller.Physical.proper_projection_full
    module: Controller.Physical.GlobalProjection
    status: proved
    note: Every local assignment on a proper channel subset extends to a globally nonzero
      qualifier assignment. This is the explicit projection obstruction used in 4.3.
  - source: Lemma 4.3, relation obstruction
    lean: Controller.Physical.valid_local_relations_accept_zero
    module: Controller.Physical.GlobalProjection
    status: proved
    note: Any family of proper-scope relations valid on every nonzero qualifier assignment
      also accepts every local projection of zero. It therefore cannot express global nonemptiness
      using only those relations.
  - source: Theorem 4.4
    lean: Controller.Physical.stuck_detectable_iff
    module: Controller.Physical.StuckAtImage
    status: proved
    note: For the specified final-qualifier stuck occurrence, detection is equivalent to at
      least two channels and either stuck one or equality of target and distinguished channel.
      Selector occurrences are unchanged; this is the displayed observation fault model.
