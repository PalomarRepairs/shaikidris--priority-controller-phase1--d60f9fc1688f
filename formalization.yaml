version: v0.4
project:
  name: Exact fault images in priority controllers
  description: Exact reachable qualifier-set images for a finite priority controller with
    independent enable and request inputs and a specified first-stage bridge interface. The
    formal statements characterize detection through arbitrary Boolean qualifier observations,
    show that nonemptiness cannot be expressed by valid proper-coordinate relations, and classify
    a specified qualifier-only stuck-at fault. The selector and fault equations are explicit.
  authors:
  - Idris Ali Shaik
  license: Apache-2.0
  responsible_maintainers:
  - Idris Ali Shaik
